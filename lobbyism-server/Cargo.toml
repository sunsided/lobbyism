[package]
name = "lobbyism-server"
description = "Transport-agnostic lobby and matchmaking server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["netcode", "cli", "dotenv"]
## Issue renet / netcode.io `ConnectToken`s.
netcode = ["dep:renet_netcode"]
## Build the `lobbyism-server` binary.
cli = ["netcode", "dep:tracing-subscriber"]
## Let the binary read `LOBBYISM_*` variables from a `.env` file (real environment variables win).
dotenv = ["cli", "dep:dotenvy"]

[dependencies]
lobbyism = { version = "0.1.0", path = "../lobbyism", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.13"
renet_netcode = { version = "2", optional = true }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
getrandom = "0.4"
dotenvy = { version = "0.15.7", optional = true }

[[bin]]
name = "lobbyism-server"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
proptest = "1"

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`, which exposes `Core::check_invariants`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package.metadata.release]
# The workspace gets a single vX.Y.Z tag, created for the lobbyism crate.
tag = false
