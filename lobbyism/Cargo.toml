[package]
name = "lobbyism"
description = "Lobbies and matchmaking for Rust games: wire protocol and async WebSocket client (native and Wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["client"]
## The async WebSocket client. Without it, the crate is the wire protocol only.
client = ["dep:futures-util", "dep:serde_json", "dep:tokio-tungstenite-wasm"]

[dependencies]
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
serde_json = { version = "1", optional = true }
tokio-tungstenite-wasm = { version = "0.9", optional = true }

[dev-dependencies]
lobbyism-server = { path = "../lobbyism-server" }
renet = "2"
renet_netcode = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[[example]]
name = "renet_match"
required-features = ["client"]

[[test]]
name = "handshake"
required-features = ["client"]
