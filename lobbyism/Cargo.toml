[package]
name = "lobbyism"
description = "Lobbies and matchmaking for Rust games: wire protocol and async WebSocket client (native and Wasm) that receives renet ConnectTokens or matchbox rooms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["matchmaking", "lobby", "multiplayer", "gamedev", "renet"]
categories = ["game-development", "network-programming", "wasm", "web-programming::websocket"]

[features]
default = ["client"]
## The async WebSocket client. Without it, the crate is the wire protocol only.
client = ["dep:futures-util", "dep:serde_json", "dep:tokio-tungstenite-wasm"]
## Find LAN hosts announced by UDP broadcast (native only).
lan-broadcast = ["dep:serde_json", "dep:socket2", "dep:tokio"]
## Find LAN hosts announced over mDNS / DNS-SD (native only).
lan-mdns = ["dep:mdns-sd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
serde_json = { version = "1", optional = true }
tokio-tungstenite-wasm = { version = "0.9", optional = true }
mdns-sd = { version = "0.21", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
tokio = { version = "1", features = ["net", "time"], optional = true }

[dev-dependencies]
lobbyism-server = { path = "../lobbyism-server", features = ["lan-broadcast", "lan-mdns"] }
renet = "2"
renet_netcode = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[[example]]
name = "renet_match"
required-features = ["client"]

[[example]]
name = "lan_match"
required-features = ["client", "lan-broadcast"]

[[test]]
name = "lan_mdns"
required-features = ["lan-mdns"]

[[test]]
name = "handshake"
required-features = ["client"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Document the feature-gated LAN API too.
all-features = true
