name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and attest but publish nothing, to test the pipeline.
  workflow_dispatch:

permissions: {}

# Never cancel a release halfway; a second tag push waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish lobbyism-server
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # record the attested artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the workspace version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lobbyism-server") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match lobbyism-server version $version"
            exit 1
          fi
      - name: Install Rust and cargo-auditable
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          cargo install cargo-auditable --locked --version 0.7.7
      # No build cache here: a release must not depend on cache entries other workflows wrote.
      - name: Test
        run: cargo test --locked --workspace --all-targets
      # cargo-auditable embeds the dependency list (.dep-v0 section), so
      # `cargo audit bin`, Trivy or Syft can check the shipped binary later.
      - name: Build static binary
        run: cargo auditable build --locked --release -p lobbyism-server --target x86_64-unknown-linux-musl
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="lobbyism-server-${TAG}-x86_64-unknown-linux-musl"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-musl/release/lobbyism-server .env.example LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*/lobbyism-server
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.sha256 --title "$TAG" --generate-notes --verify-tag
